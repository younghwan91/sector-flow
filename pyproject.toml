[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sector-flow"
version = "0.1.0"
description = "코스피·코스닥 섹터 자금흐름 일일 리포트와 터미널 화면(sw-flow·sw-ledger) — 동시기 측정이지 예측이 아니다"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Younghwan Chae", email = "chyohw97@gmail.com" }]
# 화면(sw-flow·sw-ledger)은 표준 라이브러리만 쓰고 리포트 JSON 만 읽는다. pandas·psycopg2 는 리포트 생성용.
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
pg = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "ruff==0.16.2"]

[project.scripts]
sw-flow = "sectorflow.tui.flow_app:main"
sw-ledger = "sectorflow.tui.ledger_app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sectorflow"]

[tool.ruff.lint]
# 룰셋을 명시한다 — ruff 기본 선택은 릴리스마다 넓어진다. dev extra 의 ruff 핀과 한 쌍이다.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
