[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sector-flow"
version = "0.1.0"
description = "코스피·코스닥 섹터 자금흐름 일일 리포트와 터미널 화면(sw-flow·sw-ledger) — 동시기 측정이지 예측이 아니다"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Younghwan Chae", email = "chyohw97@gmail.com" }]
# 화면(sw-flow·sw-ledger)은 표준 라이브러리만 쓰고 리포트 JSON 만 읽는다. pandas·psycopg2 는 리포트 생성용.
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
pg = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "pytest-cov>=7.0", "ruff==0.16.2"]

[project.scripts]
sw-flow = "sectorflow.tui.flow_app:main"
sw-ledger = "sectorflow.tui.ledger_app:main"
# 리포트 생성기 — 파일은 scripts/ 에 두고 wheel 이 sectorflow/_scripts/ 로 복사한다(src/sectorflow/report_cli.py).
sector-flow-payload = "sectorflow.report_cli:payload"
sector-flow-numbers = "sectorflow.report_cli:numbers"
sector-flow-gate = "sectorflow.report_cli:gate"
sector-flow-verify = "sectorflow.report_cli:verify"
# 합성 데모 폴더(실데이터 아님) — `sw-flow --demo` 가 같은 것을 부른다.
sector-flow-demo = "sectorflow.demo:main"
# BYO 수집기(자기 키움 키 → sqlite). 읽기 전용 TR 6개만 부른다.
sector-flow-collect = "sectorflow.collect.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sectorflow"]

# 리포트 생성기와 템플릿을 wheel 에 싣는다 — 없으면 `uv tool install .` 한 사용자는 리포트를 못 만든다.
[tool.hatch.build.targets.wheel.force-include]
"scripts/sector_flow.py" = "sectorflow/_scripts/sector_flow.py"
"scripts/sector_numbers.py" = "sectorflow/_scripts/sector_numbers.py"
"scripts/completeness_gate.py" = "sectorflow/_scripts/completeness_gate.py"
"scripts/verify_report.py" = "sectorflow/_scripts/verify_report.py"
# 템플릿(sector_flow.html·sector_numbers.html)은 여기 말고 빌드 훅(hatch_build.py)이 파일 하나씩 싣는다 —
# 설치본은 원격 글꼴을 부르지 않게 떼어 낸 사본이다(src/sectorflow/offline_templates.py).

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff.lint]
# 룰셋을 명시한다 — ruff 기본 선택은 릴리스마다 넓어진다. dev extra 의 ruff 핀과 한 쌍이다.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
# 변경 줄 커버리지(`scripts/diff_coverage.py`, CI)용. 리포트 단계·검증기는 테스트가 **서브프로세스**로 돌리므로
# subprocess 패치가 없으면 scripts/ 가 통째로 0% 로 보인다.
source = ["src", "scripts"]
relative_files = true
patch = ["subprocess"]
# 3.12+ 의 sys.monitoring — 기본(ctrace)은 검증기(순수 파이썬 계산)를 4배 느리게 해 테스트가 30초 → 100초가 됐다.
core = "sysmon"

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
