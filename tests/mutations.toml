id = "ci-plan-compares-to-previous-commit"
why = "main 의 문서 판정이 직전 커밋과 견준다 — 빨간 코드 위 문서 커밋이 전체 변이를 건너뛰어 관문을 지나간다"
guards = ["tests/test_ci_plan.py::test_docs_commit_on_top_of_a_red_code_commit_still_runs_everything"]
file = "scripts/ci_plan.py"
find = "        return _changed(verified)"
replace = "        return _changed(\"HEAD~1\")"

[[mutation]]
id = "ci-plan-empty-diff-is-docs"
why = "바뀐 파일이 없을 때(재실행) 문서로 본다 — 변이를 돌리려고 다시 돌린 실행이 아무것도 안 돈다"
guards = ["tests/test_ci_plan.py::test_unknown_base_runs_everything"]
file = "scripts/ci_plan.py"
find = "    docs = bool(changed) and all(is_doc(f) for f in changed)"
replace = "    docs = changed is not None and all(is_doc(f) for f in changed)"

[[mutation]]
id = "ci-plan-unknown-base-is-docs"
why = "기준을 모를 때 문서로 본다 — gh 조회 실패가 곧 전체 변이 건너뛰기다(열린 쪽으로 실패)"
