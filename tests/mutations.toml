file = "scripts/ci_plan.py"
find = "    docs = bool(changed) and all(is_doc(f) for f in changed)"
replace = "    docs = changed is None or all(is_doc(f) for f in changed)"

[[mutation]]
id = "ci-plan-renames-hide-the-source"
