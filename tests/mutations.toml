Col(header,width,right,fn) 로 헤더와 셀이 한 정의에서 나온 뒤로는 열을 빼도
어긋나지 않고 그냥 사라진다 — **버그가 아니게 됐다.** 남은 위험은 어긋남이
아니라 헤더가 말하는 것과 다른 값을 그리는 것이다."""
