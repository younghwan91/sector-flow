file = "scripts/ledger_numbers.py"
find = "from sectorflow.tui.ledger_view import ACTOR_KEYS, _corr, load, neg_frac"
replace = """import math

from sectorflow.tui.ledger_view import ACTOR_KEYS, load


def _corr(a, b) -> float:
    n = len(a)
    ma, mb = sum(a) / n, sum(b) / n
    va = sum((x - ma) ** 2 for x in a)
    vb = sum((y - mb) ** 2 for y in b)
    if va <= 0 or vb <= 0:
        return 0.0
    return sum((a[i] - ma) * (b[i] - mb) for i in range(n)) / math.sqrt(va * vb)


def neg_frac(v):
    return sum(1 for c in v if c < 0) / len(v)"""

