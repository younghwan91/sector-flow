  <text x="216" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#524c44">KOSPI · KOSDAQ Sector Capital Flow Map &amp; Ledger</text>

