# simnode 에서 KIWOOM_APP_KEY 를 쓰는 프로그램의 운영 창 — sector-flow-collect 는 이 창에서 키움을 부르지 않는다.
# 쓰는 법: sector-flow-collect --busy-file deploy/kiwoom_busy.simnode.toml ...  (또는 SECTORFLOW_BUSY_FILE)
#
# 근거는 2026-11-08 에 읽기 전용으로 확인한 스케줄이다. 소요 시간은 Airflow 로그(~/git/quant-airflow/logs)의 최근 3회 실측이고,
# 창 앞뒤에 여유를 두었다. 스케줄이 바뀌면 여기도 고친다.
#   quant-airflow (dags/*.py, kiwoom_env() 를 쓰는 DAG 만):
#     daily_finalize        30 6 * * 2-6   실측 06:30~07:25
#     daily_short_credit    0 10 * * 2-6   실측 10:00~10:50
#     daily_collection_catchup 5 10 * * 1-5 (빈 날만 수집 — 보통 수 초)
#     weekly_listed_shares  10 10 * * 2    실측 10:10~10:59
#     daily_collection      0 16 * * 1-5   실측 16:01~16:50 (재시도·지연으로 18:47 까지 간 날이 있다)
#     daily_bars_raw        0 19 * * 1-5   실측 19:00~19:49
#     weekly_history_backfill 0 11 * * 0   전체 재수집 약 1시간(DAG 주석)
#   키움을 안 쓰는 것(창에 넣지 않음): weekly_delisted_stocks(krx·naver·dart), monthly_listed_shares_backfill(dart).
#   scalp-it (deploy/crontab.simnode):
#     pair_detect_daily.sh  55 8 * * 1-5  tick-collect 를 대신해 장중 내내 키를 문다 — 15:40 pkill
#     cli_intraday          45 15 * * 1-5  분봉 1,400종목 × 6쪽
#     scalp-theme-snapshot  10 16 * * 1-5
# 평일 08:45~20:00 은 위 작업들이 촘촘히 이어져 하나로 묶었다.

[[window]]
days = ["mon", "tue", "wed", "thu", "fri"]
start = "08:45"
end = "20:00"
why = "평일 장중·장후 — scalp-it 장중 수집(08:55~15:40)·분봉(15:45)·quant-airflow 수집(10:00·16:00·19:00)"

[[window]]
days = ["tue", "wed", "thu", "fri", "sat"]
start = "06:25"
end = "07:45"
why = "quant-airflow daily_finalize (30 6 * * 2-6), 실측 06:30~07:25"

[[window]]
days = ["sat"]
start = "09:55"
end = "11:00"
why = "quant-airflow daily_short_credit (0 10 * * 2-6), 실측 10:00~10:50"

[[window]]
days = ["sun"]
start = "10:55"
end = "12:30"
why = "quant-airflow weekly_history_backfill (0 11 * * 0), 약 1시간"
