name: Pages

# 공개 랜딩(GitHub Pages) — main 푸시마다 합성 데모로 사이트를 짓고, 공개 표면 검사를 지나야 배포한다.
# 실데이터는 이 길로 나갈 수 없다: site/build.py 는 데모 폴더(DEMO.txt 표식·"demo": true·'가상' 섹터)만 받고, 데모도 여기서
# 이 코드로 새로 짓는다. 그 뒤 tests/test_public_surface.py·tests/test_site.py 가 지은 _site/ 를 본다(설계
# docs/superpowers/specs/2026-11-21-flow-map-brand-design.md §4·§6).
#
# 배포 관문(dotfiles `pull-all --ci-gate`)은 main 머리 커밋의 체크를 본다 — 이 잡이 빨가면 다음날 배치 배포도 멈춘다. 그래서:
# - 짓기·공개 표면 검사의 실패는 빨갛게 둔다. 데모가 아닌 것이 나갈 뻔했다면 배포를 멈출 일이다.
# - Pages 쪽 사정(설정 꺼짐·일시 장애)으로 배포 스텝만 실패하면 잡은 초록으로 두고 경고 주석을 남긴다 — 랜딩 때문에 배치가 멈추지 않게.
# 청구: 잡 하나 약 2분(설치·데모 짓기·검사·배포) — scripts/ci_plan.py 표 push 의 pages, tests/test_ci_workflow.py 가 대조한다.
# PR 에는 돌지 않는다 — 같은 검사(tests/test_site.py·test_public_surface.py)는 CI 의 pytest 가 PR 마다 돈다.

on:
  push:
    branches: [main]

permissions:
  contents: read

# 배포는 한 번에 하나 — 앞의 배포를 끊지 않는다(끊긴 실행은 cancelled 라 그 커밋이 머리면 관문이 보류한다).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      # 데모를 이 코드로 새로 짓는다(--demo 를 주지 않는다) — 받은 폴더·리포트 폴더를 읽을 길이 없다.
      - name: Build demo site
        run: uv run --no-sync python site/build.py --out _site
      - name: Public surface check
        run: uv run --no-sync pytest -q tests/test_public_surface.py tests/test_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Deploy failed
        if: ${{ steps.deploy.outcome == 'failure' }}
        run: echo "::warning title=Pages 배포 실패::랜딩을 못 올렸다(설정 Settings → Pages → Source 가 GitHub Actions 인지 확인). 짓기·공개 표면 검사는 통과했다."
