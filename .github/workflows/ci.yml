name: CI

# 머지 한 번에 PR·main 두 실행이 돈다. 소모가 11월 9일간 38건의 머지 뒤 잡을 멈추게 했다(결제·지출 한도). GitHub 은 잡마다 벽시계를 분으로
# 올림해 청구한다 — 잡을 나눠도 일은 안 줄고 설치·기준선만 는다. 그래서 전체 검증은 **잡 하나**다.
#
#              검사(pytest)                  주입 검증
#   문서만     3.13 하나                     안 돈다 — 앵커 사망은 tests/test_mutation_spec.py 가 pytest 에서 잡는다
#   PR(코드)   3.13 + 커버리지 + 3.11 문법    mutations-pr: --scope direct, 직접 건드린 변이만
#   main(코드) gate 하나(3.11)               gate: 전체 변이. 기준선이 전체 pytest 라 검사 한 벌을 겸한다, 동시 2
#
# 코드 머지당 **70분 이하**(상한 80, 표 scripts/ci_plan.py `--minutes`, tests/test_ci_workflow.py 가 대조한다). 예상 약 50분:
#   PR 약 16 = plan 1 + 신원 1 + test 약 10 + 직접 변이 약 4 / main 약 34 = plan 1 + 신원 1 + gate 약 30 + 공개 랜딩 약 2(pages.yml).
#   gate 는 기준선 약 8.5(전체 pytest 4410건 로컬 6.7분 × 러너 1.07 + 부하) + 주입 약 20(1367건 로컬 28.7분 × 1.15 ÷ 동시 2, 몫 차이 포함).
#   이전: 2026-11-08 main 한 번 37.3분(변이 681개·4샤드)이고 변이 1367개·8샤드면 머지당 109~141분이었다. 실측은 이 설계가 처음 돈 뒤 다시 적는다.
#   쓴 근거(같은 공통 변이 681개, a2f31f3): 러너 pytest 184초 대 로컬 172초 = 1.07배. 주입은 18.3분 대 9.4분 = 1.95배였는데 러너의 새 venv 에서
#   변이마다 전부 다시 컴파일한 탓이다(가드 하나 0.47초 → .pyc 가 있으면 0.15초). 이제 기준선이 .pyc 를 남긴다(verify_merge.py 머리말).
#   예산을 넘으면 gate 가 빨개진다 — 샤드를 늘려도 청구 분은 안 준다. 느린 가드를 줄이거나 표부터 다시 계산한다.
#
# 배포 관문과의 관계(dotfiles `pull-all --ci-gate`): **머리 커밋**의 체크가 전부 success·skipped·neutral 이어야 받고,
# 체크가 0개거나 하나라도 돌고 있으면 보류한다. 그래서:
# - `paths` 필터를 쓰지 않는다. 워크플로째 건너뛰면 그 커밋엔 신원 검사만 남아, 빨간 코드 커밋 위에 문서 커밋을 얹는
#   것으로 관문을 지나간다. 워크플로는 늘 돌고 잡만 건너뛴다(잡의 skipped 는 관문을 막지 않는다).
# - main 의 문서 판정은 직전이 아니라 **마지막 초록 main 커밋**과 견준다(scripts/ci_plan.py) — 머리가 초록이면 머리의 코드
#   트리는 전체 변이를 지났거나 지난 트리와 같다. 이 성질은 예전과 똑같다. gate 는 문서 판정이 아닌 모든 main 커밋에서 돈다.
# - `if` 는 `!= 'docs'` 로 쓴다 — plan 출력이 비면 건너뛰지 않고 돈다. plan 이 죽으면 그 빨강이 관문을 막는다.
#
# 줄어든 것(보호는 머지 뒤로 옮겨 갔을 뿐 배포 전이다):
# - PR 이 전체 변이를 통과해야 머지하던 것 — 직접 닿지 않은 변이의 실패는 머지 뒤 main 에서 드러난다(로컬 pre-push 의 changed 범위가
#   넓게 먼저 본다, --no-verify 면 없다). 그때 main 이 빨개져 배포가 멈추고, 고칠 때까지 다른 머지의 배포도 같이 멈춘다.
# - 3.11 전체 pytest 가 머지 전이 아니라 머지 뒤다(PR 엔 3.11 문법 검사만). 3.12 는 CI 에서 빠졌다 — 로컬 pre-push 가 돌고, 양 끝 사이라 위험이 작다.
# - main 의 3.13 pytest·변경 줄 커버리지(main 에선 바뀐 줄이 없어 비어 있었다)는 PR 머리에서 본 것으로 대신한다.
# - 동시 2: 시간에 민감한 검사가 빠듯해질 수 있다. 빨강은 REJECT 로 드러나고, 거짓 '잡힘' 은 그 변이의 그 실행에 그친다(다음 실행이 다시 본다).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 같은 PR·main 에 새 커밋이 오면 앞 실행을 끊는다 — 관문은 머리만 보므로 지나간 커밋의 결과는 쓰이지 않고, 끊긴 실행은
# 초록이 아니라 다음 실행의 견줄 기준도 안 된다. 이벤트를 그룹에 넣어 다른 이벤트가 머리의 실행을 못 끊게 한다.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 로컬 pre-push(dotfiles ci-local)가 고르는 판 — 아래 matrix 가 식이라 그쪽이 못 읽는다. CI 잡은 이 값을 안 쓴다.
  PYTHON_VERSION: "3.12"
  # 러너는 PRIVATE 라 2코어·8GB 다. 프로세스 상한 3000MB(평소 피크 약 2GB, 이 값으로 변이 1367건 통과), 트리 합 상한은 그 두 배 6000MB —
  # 넘으면 하네스 감시자가 가장 큰 자손을 죽이고 stderr 에 적는다. 러너가 통째로 죽으면 잡 로그가 안 남는다(scripts/memcap.py).
  SECTOR_FLOW_MEM_LIMIT_MB: "3000"

jobs:
  # ci-local 은 `${{ }}` 가 든 run 스텝을 건너뛴다 — 이 잡은 CI 에서만 돈다. `if` 를 달지 않는다(체크가 늘 하나는 있다).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read           # 마지막 초록 실행을 찾는다
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      python: ${{ steps.plan.outputs.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gh 가 실패하면 기준이 비어 전체를 돈다(ci_plan.py) — 끊긴 판정이 초록으로 남지 않게 `|| true` 는 조회에만 둔다.
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified=""
          if [ "${{ github.event_name }}" = "push" ]; then
            verified=$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 \
              --json headSha --jq '.[0].headSha // ""' || true)
          fi
          python3 scripts/ci_plan.py --event "${{ github.event_name }}" --base "origin/${{ github.base_ref || 'main' }}" \
            --verified "$verified" >> "$GITHUB_OUTPUT"

  # main 의 코드 커밋은 안 돈다 — gate 가 전체 pytest 를 겸한다. 조건은 gate 의 정확한 여집합이다(plan 출력이 비면 gate 쪽으로 간다).
  test:
    needs: plan
    if: ${{ github.event_name == 'pull_request' || needs.plan.outputs.kind == 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.plan.outputs.python) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 변경 줄 커버리지(merge-base)·연구 스크립트의 사전등록 판(git show)
      # setup-uv 는 v8 부터 떠다니는 major 태그(@v10)를 내지 않는다 — 버전을 박는다.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --no-sync ruff check src/ tests/ scripts/ research/
      # 연구 스크립트는 DB 에 붙어야 돌아서 평소엔 아무도 안 돌린다 — 문법만이라도 매번 본다.
      # 리포트 코드 이름 참조는 tests/test_research_refs.py 가 본다.
      - name: Research compiles
        run: uv run --no-sync python -m compileall -q research
      # 하한 판의 전체 pytest 는 머지 뒤 gate 가 돈다. 머지 전엔 문법만 — 새 f-string 문법 같은 3.11 전용 실패가 실제로 있었다. 수 초다.
      - name: Floor python syntax
        run: uv run --no-project --python 3.11 python -m compileall -q src scripts tests research
      # 3.12+ 는 sys.monitoring 으로 커버리지를 같이 잰다(+15% 안팎). 3.11 은 그게 없어 검증기가 4배
      # 느려지므로 재지 않는다 — 변경 줄 판정은 3.12+ 판(PR·문서는 3.13)이 한다.
      - name: Test
        run: |
          if uv run --no-sync python -c 'import sys; sys.exit(sys.version_info < (3, 12))'; then
            uv run --no-sync pytest -q --cov --cov-report=json:coverage.json
          else
            uv run --no-sync pytest -q
          fi
      # 화면 층 — 문서 커밋엔 안 돈다. 식이 있어 ci-local 은 건너뛴다(gate 의 같은 스텝이 돈다). 합성 데모는 이 코드로 짓는다.
      - name: Screen layers (demo)
        if: ${{ needs.plan.outputs.kind != 'docs' }}
        run: uv run --no-sync python scripts/verify_merge.py . --base "origin/${{ github.base_ref || 'main' }}" --only render,pty --demo
      # 3.12+ 에서는 coverage.json 이 **있어야 한다**(없으면 diff_coverage 가 2 로 실패) — 파일 유무로 건너뛰면
      # 커버리지 실행이 빠져도 초록이다. 새 파일은 하나하나 50% 바닥도 본다.
      - name: Diff coverage (src/ scripts/ 바뀐 줄 80%)
        run: |
          if uv run --no-sync python -c 'import sys; sys.exit(sys.version_info < (3, 12))'; then
            uv run --no-sync python scripts/diff_coverage.py --base origin/main --json coverage.json --min 80
          fi

  # 합친 트리의 전체 검증 — 린트·화면 층·전체 pytest·전체 변이를 **잡 하나**에서. 코드 머지당 청구 분의 대부분이고 머리말이 그 산수다.
  # 주입 검증은 tests/mutations.toml 의 변이를 소스에 실제로 넣어 선언한 가드가 빨개지는지 본다. "테스트가 초록" 은 검사가 살아 있다는 뜻이
  # 아니다. 이 단계가 CI 밖에 있는 동안 앵커를 잃은 변이 셋이 조용히 죽었다(경고만 남았고 아무도 안 읽었다).
  #
  # 시간: (1) 기준선을 전체 pytest 한 번에(검사를 겸한다), (2) 사본 둘에서 동시에(2코어, 청구는 벽시계), (3) 35분 예산을 하네스가 잰다 — 넘으면
  # REJECT 와 느린 변이 목록이 남는다. 70분이면 하네스가 먼저 멈춘다. 빨개지면 07:50 `pull-all --ci-gate` 배포가 막힌다.
  #
  # 로컬 pre-push(ci-local)는 이 잡을 CI=true·GITHUB_ACTIONS 없이 돌린다 — 하네스가 그걸 보고 merge-base 이후 바뀐 파일에 닿는 변이만,
  # 가드만, 하나씩 돈다(`verify_merge.py --scope`). 시간으로 막지 않는다. 전체는 여기서 돈다.
  gate:
    needs: plan
    if: ${{ github.event_name != 'pull_request' && needs.plan.outputs.kind != 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # merge-base(origin/main) 로 새 검사를 가린다
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --no-sync ruff check src/ tests/ scripts/ research/
      - name: Research compiles
        run: uv run --no-sync python -m compileall -q research
      # 이 코드로 지은 합성 데모로 화면 층을 돈다. 실 리포트는 러너에 없고, 옛 사본이면 새 표지가 가려진다.
      - name: Screen layers (demo)
        run: uv run --no-sync python scripts/verify_merge.py . --base origin/main --only render,pty --demo
      - name: Mutation gate
        run: uv run --no-sync python scripts/verify_merge.py . --base origin/main --only mutations --full-baseline --workers 2 --budget-min 45
      # 식이 있어 ci-local 은 건너뛴다(로컬 sudo 는 비밀번호를 묻는다). 커널 OOM 이면 원인이 여기 남는다.
      - name: Memory diagnosis
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          echo "실패한 잡의 메모리 흔적 (${{ runner.os }})"
          free -m
          sudo dmesg -T | grep -iE 'out of memory|oom-kill|killed process' | tail -n 20 || true

  # PR 범위 — 이 PR 이 직접 건드린 변이와 변이 미선언 새 검사 판정. 3분을 넘으면 경고하고 6분에 멈춘다(PR 을 시간으로 막지 않는다 — 나머지는
  # gate 가 돈다). run 에 `${{ }}` 를 두어 ci-local 이 건너뛴다 — 로컬은 위 잡이 더 넓은 changed 범위로 이미 돈다.
  mutations-pr:
    needs: plan
    if: ${{ github.event_name == 'pull_request' && needs.plan.outputs.kind != 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Mutation gate (PR)
        run: uv run --no-sync python scripts/verify_merge.py . --base "origin/${{ github.base_ref }}" --only mutations --scope direct --budget-min 3
