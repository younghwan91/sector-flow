name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv 는 v8 부터 떠다니는 major 태그(@v10)를 내지 않는다 — 버전을 박는다.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --no-sync ruff check src/ tests/ scripts/
      - name: Test
        run: uv run --no-sync pytest -q

  # 주입 검증 — tests/mutations.toml 의 변이를 소스에 실제로 넣어 선언한 가드가 빨개지는지 본다.
  # "테스트가 초록" 은 검사가 살아 있다는 뜻이 아니다. 이 단계가 CI 밖에 있는 동안
  # 앵커를 잃은 변이 셋이 조용히 죽었다(경고만 남았고 아무도 안 읽었다).
  # DB·실데이터 불요. 변이 하나에 pytest 두 번이라 수 분 걸린다 — 한 파이썬에서만 돈다.
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # merge-base(origin/main) 로 새 검사를 가린다
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Mutation gate
        run: uv run --no-sync python scripts/verify_merge.py . --base origin/main --only mutations
