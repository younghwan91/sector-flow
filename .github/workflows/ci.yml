name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 변경 줄 커버리지(merge-base)·연구 스크립트의 사전등록 판(git show)
      # setup-uv 는 v8 부터 떠다니는 major 태그(@v10)를 내지 않는다 — 버전을 박는다.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --no-sync ruff check src/ tests/ scripts/ research/
      # 연구 스크립트는 DB 에 붙어야 돌아서 평소엔 아무도 안 돌린다 — 문법만이라도 매번 본다.
      # 리포트 코드 이름 참조는 tests/test_research_refs.py 가 본다.
      - name: Research compiles
        run: uv run --no-sync python -m compileall -q research
      # 3.12+ 는 sys.monitoring 으로 커버리지를 같이 잰다(+15% 안팎). 3.11 은 그게 없어 검증기가 4배
      # 느려지므로 재지 않는다 — 변경 줄 판정은 3.12·3.13 이 한다.
      - name: Test
        run: |
          if uv run --no-sync python -c 'import sys; sys.exit(sys.version_info < (3, 12))'; then
            uv run --no-sync pytest -q --cov --cov-report=json:coverage.json
          else
            uv run --no-sync pytest -q
          fi
      - name: Diff coverage (src/ scripts/ 바뀐 줄 80%)
        run: |
          if [ -f coverage.json ]; then
            uv run --no-sync python scripts/diff_coverage.py --base origin/main --json coverage.json --min 80
          fi

  # 주입 검증 — tests/mutations.toml 의 변이를 소스에 실제로 넣어 선언한 가드가 빨개지는지 본다.
  # "테스트가 초록" 은 검사가 살아 있다는 뜻이 아니다. 이 단계가 CI 밖에 있는 동안
  # 앵커를 잃은 변이 셋이 조용히 죽었다(경고만 남았고 아무도 안 읽었다).
  #
  # 시간: 한 잡으로 돌 때 261개 8분 → 302개 22.7분(잡 상한 30분)으로 PR 마다 늘었다. 상한에 걸리면
  # 07:50 `pull-all --ci-gate` 배포가 막힌다. 그래서 (1) 가드 기준선을 pytest 한 번에, (2) e2e 는 필요한
  # 검증 층만, (3) 예상 비용으로 4몫에 나눠, (4) 몫마다 12분 예산을 하네스가 잰다 — 넘으면 REJECT 와
  # 느린 변이 목록이 남는다(그때 shard 를 늘린다: matrix 와 SHARD 의 /4 를 같이). 24분이면 하네스가 먼저 멈춘다.
  #
  # 로컬 pre-push(ci-local)는 이 잡을 CI=true·GITHUB_ACTIONS 없이 돌린다 — 하네스가 그걸 보고 merge-base
  # 이후 바뀐 파일에 닿는 변이만 돈다(`verify_merge.py --scope`). 전체는 여기서 돈다.
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # merge-base(origin/main) 로 새 검사를 가린다
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Mutation gate
        env:
          # run 이 아니라 env 에 둔다 — ci-local 은 `${{ }}` 가 든 run 스텝을 통째로 건너뛴다.
          # 거기선 글자 그대로 넘어오고, 로컬 changed 범위는 샤드를 쓰지 않는다.
          SHARD: ${{ matrix.shard }}/4
        run: uv run --no-sync python scripts/verify_merge.py . --base origin/main --only mutations --shard "$SHARD" --budget-min 12
