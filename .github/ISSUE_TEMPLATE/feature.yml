name: 기능 제안
description: 화면·문서·도구에 더했으면 하는 것
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        이 도구는 투자 주체별 섹터 순매매를 **관측**합니다. 종목·섹터를 고르게 하거나 앞날을 점치는 기능
        (점수·순위·매수 후보·예측)은 받지 않습니다. 실데이터는 붙이지 말고, 예가 필요하면 합성 데모로 보여 주세요.
  - type: checkboxes
    id: scope
    attributes:
      label: 확인
      options:
        - label: 고르기·예측 기능이 아니다
          required: true
        - label: 실데이터·리포트 폴더를 붙이지 않았다
          required: true
  - type: textarea
    id: need
    attributes:
      label: 무엇이 불편한가
      description: 지금 화면에서 보려다 못 보는 것
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 제안
      description: 어떻게 보이면 좋겠나(데모로 그린 예·스케치 환영)
